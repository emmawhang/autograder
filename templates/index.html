<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GW08 Autograder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }
      h1 {
        margin-top: 0;
      }
      .error {
        background: #fbe9e9;
        color: #8b1e1e;
        border: 1px solid #e6b1b1;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      input[type="file"], button {
        font-size: 16px;
      }
      input[type="file"] {
        padding: 10px;
        border: 1px solid #d8dfe8;
        border-radius: 8px;
      }
      button {
        background: #1f6feb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        cursor: pointer;
      }
      p {
        color: #495365;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>GW08 Autograder</h1>
      <p>Upload a student's homework notebook or script to grade it against the GW08 Table 3 rubric.</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/grade" enctype="multipart/form-data">
        <input type="file" name="student_file" accept=".ipynb,.py,.txt,.md" required>
        <button type="submit">Grade submission</button>
      </form>
    </div>
  </body>
</html>
